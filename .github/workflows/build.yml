name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Descomprimir el zip del mod
        run: |
          ZIP=$(ls -t *.zip | head -n 1)
          echo "Usando $ZIP"
          rm -rf _mod && mkdir _mod
          unzip -q -o "$ZIP" -d _mod
          GRADLE_FILE=$(find _mod -name build.gradle | head -n 1)
          echo "MOD_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Compilar
        working-directory: ${{ env.MOD_DIR }}
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: ${{ env.MOD_DIR }}/build/libs/*.jar
